<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #cam {
        position: absolute;
        inset: 0;
      }
      #cam video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>

      data-duration="23.7"

      ></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // Whip: the finished bowl smears out left, the empty-pot shot lands from the right
      tl.fromTo("#cam", { x: 0, scale: 1 }, { x: -120, scale: 1.25, duration: 0.25, ease: "power3.in" }, 1.75);
      tl.fromTo("#cam", { x: 120, scale: 1.25 }, { x: 0, scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, 2.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
