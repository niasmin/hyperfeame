  <style>

    @font-face {

    }
    @font-face {
      font-family: "Kanit";
      font-weight: 600;
      src: url("assets/fonts/kanit-latin-600-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+2000-206F;
    }
    #root {
      position: absolute;
      inset: 0;
      font-family: "Kanit", sans-serif;
      --red: #e4252c;
      --yellow: #ffd400;
      --ink: #1a1208;
    }
    .pill {
      position: absolute;
      left: 50%;
      padding: 0 48px 12px;
      border-radius: 28px;
      font-weight: 800;
      line-height: 1.25;
      white-space: nowrap;
      box-shadow: 0 14px 0 rgba(0, 0, 0, 0.25);
    }

    /* Hook: on screen from frame 0 */
    #hook-1 {
      top: 250px;
      font-size: 170px;
      color: #fff;
      background: var(--red);
    }
    #hook-2 {
      top: 520px;
      font-size: 150px;
      color: var(--red);
      background: var(--yellow);
    }

    /* Peak: one word per beat of the slow motion */
    #peak {
      position: absolute;
      left: 0;
      right: 0;
      top: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    #peak span {
      font-weight: 800;
      font-size: 130px;
      line-height: 1.2;
      color: #fff;
      text-shadow:
        0 6px 0 var(--red),
        0 10px 30px rgba(0, 0, 0, 0.6);
    }
    #peak span:nth-child(2) {
      color: var(--yellow);
    }

    /* End card */
    #end-scrim {
      position: absolute;
      left: 0;
      right: 0;
      top: 640px;
      height: 1280px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.55) 35%, rgba(0, 0, 0, 0.72));
    }
    #end-brand {
      top: 900px;
      font-size: 150px;

    #end-cta {

      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
    }
  </style>

  <div
    id="root"
    data-composition-id="texts"
    data-width="1080"
    data-height="1920"
    data-composition-variables='[
      {"id":"hook1","type":"string","label":"Hook line 1","default":"คนแน่น"},
      {"id":"hook2","type":"string","label":"Hook line 2","default":"ทุกวัน!"},
      {"id":"peak1","type":"string","label":"Peak word 1","default":"เลือกเอง"},
      {"id":"peak2","type":"string","label":"Peak word 2","default":"ต้มเอง"},
      {"id":"peak3","type":"string","label":"Peak word 3","default":"อร่อยเอง"},
      {"id":"brand","type":"string","label":"Shop name","default":"มาม่า D.I.Y."},
      {"id":"cta","type":"string","label":"Call to action","default":"แวะมาต้มกันนะ!"}
    ]'
  >
    <div id="hook" class="clip" data-start="0" data-duration="2.4" data-layout-allow-overlap>
      <div id="hook-1" class="pill" data-var-text="hook1">คนแน่น</div>
      <div id="hook-2" class="pill" data-var-text="hook2">ทุกวัน!</div>
    </div>

    <div id="peak-wrap" class="clip" data-start="2.6" data-duration="2.8">
      <div id="peak">
        <span id="peak-1" data-var-text="peak1">เลือกเอง</span>
        <span id="peak-2" data-var-text="peak2">ต้มเอง</span>
        <span id="peak-3" data-var-text="peak3">อร่อยเอง</span>
      </div>
    </div>

    <div id="end" class="clip" data-start="8.6" data-duration="2.7" data-layout-allow-overlap>
      <div id="end-scrim"></div>
      <div id="end-brand" class="pill" data-var-text="brand">มาม่า D.I.Y.</div>
      <div id="end-cta" data-var-text="cta">แวะมาต้มกันนะ!</div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Hook: both pills already on screen at frame 0, springing to size
    tl.fromTo(
      "#hook-1",
      { xPercent: -50, scale: 0.55, rotation: -9 },
      { xPercent: -50, scale: 1, rotation: -4, duration: 0.45, ease: "back.out(2)" },
      0,
    );
    tl.fromTo(
      "#hook-2",
      { xPercent: -50, scale: 0.45, rotation: 8 },
      { xPercent: -50, scale: 1, rotation: 3, duration: 0.45, ease: "back.out(2)" },
      0.06,
    );
    tl.to(["#hook-1", "#hook-2"], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in", stagger: 0.05 }, 2.12);

    // Peak: one word per beat while the footage is slowed
    ["#peak-1", "#peak-2", "#peak-3"].forEach((sel, i) => {
      tl.fromTo(
        sel,
        { opacity: 0, scale: 1.4, filter: "blur(8px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" },
        2.65 + i * 0.55,
      );
    });
    tl.to(["#peak-1", "#peak-2", "#peak-3"], { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in", stagger: 0.04 }, 5.1);

    // End card: scrim, then the shop name pops, the line follows
    tl.fromTo("#end-scrim", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 8.6);
    tl.fromTo(
      "#end-brand",
      { xPercent: -50, scale: 0.5, rotation: -8, opacity: 0 },
      { xPercent: -50, scale: 1, rotation: -3, opacity: 1, duration: 0.5, ease: "back.out(1.8)" },
      8.75,
    );
    tl.fromTo(
      "#end-cta",
      { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
      9.15,
    );

    window.__timelines["texts"] = tl;
  </script>
