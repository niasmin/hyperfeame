<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #c00000;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #c00000;
      }
      /* The CCTV screen: the footage stays landscape at its own aspect, framed in the brand mustard */
      #screen {
        position: absolute;
        left: 40px;
        top: 470px;
        width: 1000px;
        height: 560px;
        border-radius: 32px;
        overflow: hidden;
        border: 10px solid #ffd45a;
        box-shadow: 0 16px 0 rgba(0, 0, 0, 0.28);
        background: #000;
      }
      #feed {
        position: absolute;
        inset: 0;
      }
      #feed video {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground"></div>
      <div id="screen" data-layout-allow-overflow>
        <div id="feed">
          <!-- 1x: the shop, seen from the camera in the corner -->
          <video
            id="cctv-a"
            class="clip"
            src="assets/video/cctv.mp4"
            playsinline
            data-has-audio="true"
            data-start="0"
            data-duration="3"
            data-media-start="0"
            data-track-index="0"
            style="z-index: 1"
          ></video>
          <!-- 4x: the crowd churns -->
          <video
            id="cctv-b"
            class="clip"
            src="assets/video/cctv.mp4"
            playsinline
            data-has-audio="true"
            data-start="3"
            data-duration="4.25"
            data-media-start="3"
            data-playback-rate="4"
            data-volume="0.5"
            data-track-index="0"
            style="z-index: 2"
          ></video>
          <!-- 1x: punched in on the cooking stations -->
          <video
            id="cctv-c"
            class="clip"
            src="assets/video/cctv.mp4"
            playsinline
            data-has-audio="true"
            data-start="7.25"
            data-duration="6.75"
            data-media-start="20"
            data-track-index="0"
            style="z-index: 3"
          ></video>
        </div>
      </div>

      <div
        id="labels"
        data-composition-id="labels"
        data-composition-src="compositions/labels.html"
        data-start="0"
        data-duration="11.25"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="11.25"
        data-duration="2.75"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 6"
      ></div>

      <audio id="sfx-pop-hook" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="0.12" data-duration="0.37" data-track-index="10" data-volume="0.7"></audio>
      <audio id="sfx-whoosh" class="clip" src=".media/audio/sfx/sfx_003.mp3" data-start="2.87" data-duration="0.57" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-pop-boom" class="clip" src=".media/audio/sfx/sfx_001.mp3" data-start="3.16" data-duration="0.72" data-track-index="10" data-volume="0.9"></audio>
      <audio id="sfx-whoosh-zoom" class="clip" src=".media/audio/sfx/sfx_003.mp3" data-start="7.12" data-duration="0.57" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-pop-logo" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="11.51" data-duration="0.37" data-track-index="10" data-volume="0.8"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // Punch in on the cooking stations (right side of the frame) when speed drops back to 1x
      tl.fromTo("#feed", { scale: 1, transformOrigin: "78% 35%" }, { scale: 1.9, duration: 0.45, ease: "expo.out" }, 7.25);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
