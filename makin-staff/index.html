<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #cam {
        position: absolute;
        inset: 0;
      }
      #cam video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- Camera: punch-in on the smile is a scale on this wrapper -->
      <div id="cam" data-layout-ignore>
        <video
          id="s1-profile"
          class="clip"
          src="assets/video/s1-profile.mp4"
          playsinline
          data-has-audio="true"
          data-start="0"
          data-duration="2.5"
          data-media-start="0"
          data-track-index="0"
          style="z-index: 1"
        ></video>
        <video
          id="s2-hang"
          class="clip"
          src="assets/video/s2-hang.mp4"
          playsinline
          data-has-audio="true"
          data-start="2.5"
          data-duration="2.0"
          data-media-start="0"
          data-playback-rate="1.5"
          data-track-index="0"
          style="z-index: 2"
        ></video>
        <video
          id="s3-packs"
          class="clip"
          src="assets/video/s3-packs.mp4"
          playsinline
          data-has-audio="true"
          data-start="4.5"
          data-duration="2.0"
          data-media-start="0"
          data-track-index="0"
          style="z-index: 3"
        ></video>
        <video
          id="s4-smile"
          class="clip"
          src="assets/video/s4-smile.mp4"
          playsinline
          data-has-audio="true"
          data-start="6.5"
          data-duration="4.0"
          data-media-start="0"
          data-playback-rate="0.6"
          data-track-index="0"
          style="z-index: 4"
        ></video>
        <video
          id="s5-end"
          class="clip"
          src="assets/video/s5-end.mp4"
          playsinline
          data-has-audio="true"
          data-start="10.5"
          data-duration="3.0"
          data-media-start="0"
          data-track-index="0"
          style="z-index: 5"
        ></video>
      </div>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 20"
      ></div>
      <div
        id="lines"
        data-composition-id="lines"
        data-composition-src="compositions/lines.html"
        data-start="2.5"
        data-duration="4.0"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 20"
      ></div>
      <div
        id="reveal"
        data-composition-id="reveal"
        data-composition-src="compositions/reveal.html"
        data-start="6.5"
        data-duration="4.0"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 20"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="10.5"
        data-duration="3.0"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 20"
      ></div>

      <audio
        id="sfx-pop-hook"
        class="clip"
        src=".media/audio/sfx/sfx_002.mp3"
        data-start="0.16"
        data-duration="0.37"
        data-track-index="10"
        data-volume="0.8"
      ></audio>
      <audio
        id="sfx-pop-line1"
        class="clip"
        src=".media/audio/sfx/sfx_001.mp3"
        data-start="2.66"
        data-duration="0.72"
        data-track-index="11"
        data-volume="0.8"
      ></audio>
      <audio
        id="sfx-pop-line2"
        class="clip"
        src=".media/audio/sfx/sfx_002.mp3"
        data-start="4.71"
        data-duration="0.37"
        data-track-index="10"
        data-volume="0.8"
      ></audio>
      <audio
        id="sfx-whoosh"
        class="clip"
        src=".media/audio/sfx/sfx_003.mp3"
        data-start="7.22"
        data-duration="0.57"
        data-track-index="11"
        data-volume="0.8"
      ></audio>
      <audio
        id="sfx-pop-reveal1"
        class="clip"
        src=".media/audio/sfx/sfx_001.mp3"
        data-start="7.46"
        data-duration="0.72"
        data-track-index="10"
        data-volume="0.8"
      ></audio>
      <audio
        id="sfx-pop-reveal2"
        class="clip"
        src=".media/audio/sfx/sfx_002.mp3"
        data-start="8.11"
        data-duration="0.37"
        data-track-index="11"
        data-volume="0.8"
      ></audio>
      <audio
        id="sfx-pop-logo"
        class="clip"
        src=".media/audio/sfx/sfx_001.mp3"
        data-start="11.01"
        data-duration="0.72"
        data-track-index="10"
        data-volume="0.8"
      ></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // Punch in on his face as he turns and smiles, release on the cut to the end card
      tl.fromTo("#cam", { scale: 1, transformOrigin: "15% 35%" }, { scale: 1.18, duration: 0.4, ease: "expo.out" }, 7.3);
      tl.to("#cam", { scale: 1, duration: 0.01 }, 10.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
